name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  source-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source zip
        run: |
          mkdir -p dist
          zip -r "dist/loopx-console-${GITHUB_REF_NAME}.zip" meta.json package.json README.md source
      - name: Verify layout
        run: |
          ARCHIVE="dist/loopx-console-${GITHUB_REF_NAME}.zip"
          for f in meta.json package.json source/index.html source/style.css source/ui.js source/worker.js source/esm_dependencies.json; do
            unzip -l "$ARCHIVE" | grep -q "$f" || { echo "missing $f"; exit 1; }
          done
          echo "layout OK"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
